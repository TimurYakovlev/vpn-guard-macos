name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -v
      - run: |
          for file in control.sh install.command status.command end.command uninstall.command; do
            sh -n "$file" || exit 1
          done
      - run: python -m py_compile vpn_guard.py
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native x64 WFP library
        shell: powershell
        run: .\windows\Build.ps1
      - name: Check discovery and work-session logic without installing filters
        shell: powershell
        run: .\windows\SelfTest.ps1
